# ASTRA — Infraestrutura de desenvolvimento
# Sobe um MySQL 8 isolado em container, com dados persistidos em volume
# e o esquema criado automaticamente pelo script.sql na primeira inicialização.
# Uso: docker compose up -d   |   docker compose down   |   docker compose logs -f db

services:
  db:
    image: mysql:8.0
    container_name: astra-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # host:container — acessamos o banco em localhost:${MYSQL_PORT}
      - "${MYSQL_PORT}:3306"
    volumes:
      # Persiste os dados do MySQL mesmo se o container for recriado
      - astra_mysql_data:/var/lib/mysql
      # Roda automaticamente na PRIMEIRA inicialização (volume vazio),
      # criando o banco e as 19 tabelas do ASTRA.
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  astra_mysql_data:
